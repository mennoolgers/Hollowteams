# ---------------------------------------------------------------------------
# Presenter Cam settings
#
# Edit this file with TextEdit (or any text editor), save, and restart the app.
# Tips:
#   * Keep the spaces at the start of each line exactly as they are.
#   * Text after a # is a comment and is ignored.
#   * Colours are hex codes like "#0A3A66" (keep the quotes).
# ---------------------------------------------------------------------------

# What the app sends to Zoom / Teams / Meet.
output:
  width: 1280          # 1280 x 720 is light and sharp enough for video calls.
  height: 720          # Use 1920 x 1080 if you want full HD (uses more power).
  fps: 30

# What the app asks your webcam for. Higher than the output gives a crisper picture.
camera:
  width: 1920
  height: 1080
  fps: 30

# Your colours. Marine Blue is the main colour used across all effects.
colours:
  primary: "#0A3A66"   # Marine Blue
  deep:    "#061E36"   # Darker marine, for shadows and backgrounds
  accent:  "#6FA8DC"   # Light sea blue, for highlights
  text:    "#FFFFFF"   # Text on top of the colours

# The local web address your Stream Deck calls, e.g. http://127.0.0.1:8765/effect/confetti
# Only this Mac can reach it.
server:
  port: 8765

# ---------------------------------------------------------------------------
# Effects. Each block belongs to one file in the effects/ folder.
# Times are in seconds. Positions: top-left, top-right, bottom-left, bottom-right.
# ---------------------------------------------------------------------------
effects:

  keyword:                 # Key word pop: each press shows the next word in this list
    words:
      - "Curiosity"
      - "Listen first"
      - "Small steps"
      - "What did you notice?"
      - "Try it out"
    seconds: 5             # how long each word stays
    position: right        # right or left of you

  confetti:
    amount: 160            # pieces per press
    colours: ["#0A3A66", "#6FA8DC", "#FFFFFF", "#E9C46A", "#E07A5F", "#A8DADC"]

  countdown:
    minutes: 5             # default length; the URL ?minutes=10 overrides it
    corner: top-right
    end_text: "Time's up"
    end_seconds: 8         # how long "Time's up" stays

  logo:
    file: assets/logo.png  # put your own PNG (with transparent background) here
    height: 72             # in pixels on a 1280x720 picture
    corner: top-left
    opacity: 0.92

  glow:
    colour: "#FFB870"      # warm light; try "#6FA8DC" for a cool sea-blue wash
    strength: 0.32         # 0.1 = very subtle, 0.5 = strong

  brb:                     # "Back in a moment" screen
    title: "Back in a moment"
    subtitle: "We'll continue shortly"
    tint: 0.55             # how much Marine Blue covers the blurred camera (0 to 1)

  slides:                  # Slides beside you
    folder: slides         # put PDF exports (or folders of slide images) here
    deck: ""               # file name to start with; empty = the first one in the folder
    orientation: auto      # auto (follows each slide), landscape or portrait (crops to fit)
    animation: slide       # slide (glides in from the right) or fade
    frame: true            # thin white frame around the slide
    blur_camera: false     # soften the camera picture while slides show
    tint_camera: false     # give the camera picture a Marine Blue tint
    shade: 0.8             # how dark the area behind the slide gets (0 = not at all)
    camera_shift: 0.7      # move you left to make room (0 = stay put, 1 = all the way)
    size: 0.6              # landscape slide width, as part of the picture width

  poll:                    # Yes / No poll, answered in the chat
    questions:             # each new poll shows the next question
      - "Is this your first time here?"
      - "Did you try this before?"
      - "Ready for the next step?"
    prompt: "Type yes or no in the chat"   # e.g. "Typ ja of nee in de chat"
    yes_label: "Yes"       # e.g. "Ja"
    no_label: "No"         # e.g. "Nee"
    yes_words: ["yes", "ja", "y", "j", "yep", "👍"]   # first word of a chat message
    no_words: ["no", "nee", "n", "nope", "👎"]
    yes_colour: "#3E9E64"
    no_colour: "#D64C45"

# Reading the chat for polls.
chat:
  zoom: true               # read Zoom's chat panel (Mac; needs Accessibility for Terminal)
